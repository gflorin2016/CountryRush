<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Country Rush — TikTok Live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffd23f'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="frame"><canvas id="game"></canvas></div>

<button id="fab" type="button" title="Settings">&#9881; Controls</button>
<aside id="panel" hidden>
  <h2>TikTok connection</h2>
  <div class="row">
    <input id="inpUser" type="text" placeholder="your TikTok name (no @)" autocomplete="off" spellcheck="false">
    <button id="btnConnect" class="btn primary" type="button">Connect</button>
  </div>
  <div class="row"><input id="inpKey" type="text" placeholder="Euler API key (eulerstream.com)" autocomplete="off" spellcheck="false"></div>
  <div class="conn" id="connPill"><span class="dot"></span><span id="connText">Not connected</span></div>

  <h2>Race</h2>
  <div class="row">
    <button id="btnStart" class="btn primary" type="button">START</button>
    <button id="btnDemo" class="btn" type="button" aria-pressed="false">Demo</button>
    <button id="btnMusic" class="btn" type="button" aria-pressed="true">Music ON</button>
  </div>
  <label class="fld">Pushes to win: <b id="lblLen">60</b><input id="inpLen" type="range" min="10" max="200" step="5" value="60"></label>
  <label class="fld">Round time (seconds): <b id="lblTime">60</b><input id="inpTime" type="range" min="20" max="180" step="5" value="60"></label>
  <label class="chk"><input id="chkOnce" type="checkbox"> One vote per viewer per round</label>
  <label class="chk"><input id="chkAuto" type="checkbox" checked> Auto-start and auto-restart rounds</label>
  <label class="chk"><input id="chkGift" type="checkbox" checked> Gifts give a speed boost</label>

  <h2>TikTok "Link" address (tunnel)</h2>
  <div class="row"><input id="tunnelUrl" type="text" readonly placeholder="starts automatically with start.bat"><button id="btnCopy" class="btn" type="button">Copy</button></div>
  <p class="hint">Paste this address in TikTok Live Studio &rarr; Link. For OBS / browser source use <code>http://localhost:8765/?clean=1</code></p>
</aside>
<script type="module" src="./src/main.js"></script>
</body>
</html>
